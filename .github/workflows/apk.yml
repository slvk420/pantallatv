name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PantallaTV.apk
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk PantallaTV.apk --clobber
          else
            gh release create apk PantallaTV.apk --title "PantallaTV" --notes "Abre este enlace en el navegador del móvil Android para descargar la app." --latest
          fi
